<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jenkins Pipeline Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #08080d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { color: #7dd3fc; }
    p { color: #a1a1aa; }
  </style>
</head>
<body>
  <h1>Pipeline Test Page by Jenkins</h1>
  <p>If you're seeing this, the Jenkins pipeline successfully checked out and deployed this file.</p>
  <p id="timestamp"></p>
  <script>
    document.getElementById('timestamp').textContent = "Loaded at: " + new Date().toString();
  </script>
</body>
</html>
